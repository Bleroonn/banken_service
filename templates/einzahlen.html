{% extends "base.html" %}
 
{% block content %}
<h2>Betrag einzahlen</h2>
 
<p>
    Konto: {{ account.iban }}<br>
    Kontostand: CHF {{ account.balance }}
</p>
 
{% if message %}
<p class="ok">{{ message }}</p>
{% endif %}
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
 
<form method="post">
<label for="amount">Betrag (CHF)</label>
<input type="text" name="amount" id="amount" value="{{ request.form.amount if error else '' }}">
<button type="submit">Einzahlen</button>
<a href="/konto/{{ account.id }}">Abbrechen</a>
</form>
{% endblock %}
